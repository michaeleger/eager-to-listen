name: Update Podcast Index Local Catalog

on:
  schedule:
    # Weekly on Mondays at 06:00 UTC so devices refreshing every 21 days always get a fresh snapshot
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of top active podcasts to include (5000 to 100000)'
        required: false
        default: '35000'
        type: string

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build slim Podcast Index catalog snapshot
        run: |
          LIMIT="${{ github.event.inputs.limit || '35000' }}"
          node scripts/build-podcastindex-catalog.mjs --limit "$LIMIT" --out-dir dist/podcastindex-catalog

      - name: Publish snapshot to rolling GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="podcastindex-catalog"
          META=$(cat dist/podcastindex-catalog/podcastindex-catalog.json)
          NOTES=$(printf "Rolling partial PodcastIndex.org directory snapshot for Eager to Listen (Android & Desktop).\n\nClients refresh this snapshot automatically when their local copy is more than 21 days old.\n\n\`\`\`json\n%s\n\`\`\`" "$META")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/podcastindex-catalog/podcastindex-catalog.tsv.gz \
              dist/podcastindex-catalog/podcastindex-catalog.json \
              --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" \
              dist/podcastindex-catalog/podcastindex-catalog.tsv.gz \
              dist/podcastindex-catalog/podcastindex-catalog.json \
              --title "Podcast Index Local Catalog Snapshot" \
              --notes "$NOTES"
          fi
