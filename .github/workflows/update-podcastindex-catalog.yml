name: Refresh Bundled Podcast Index Catalog

on:
  schedule:
    # Weekly check on Mondays at 06:00 UTC; script only downloads & updates if > 21 days old
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of top active podcasts to bundle (5000 to 100000)'
        required: false
        default: '25000'
        type: string
      force:
        description: 'Force refresh even if the bundled catalog is <= 21 days old'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  refresh-bundled-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh bundled Podcast Index catalog if > 21 days old
        run: |
          LIMIT="${{ github.event.inputs.limit || '25000' }}"
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          node scripts/build-podcastindex-catalog.mjs --sync-apps --limit "$LIMIT" $FORCE_FLAG

      - name: Commit updated bundled catalog if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/assets/podcastindex-catalog.tsv.gz \
                  desktop/src/assets/podcastindex-catalog.tsv.gz \
                  catalog/podcastindex-catalog.json
          if git diff --cached --quiet; then
            echo "Bundled catalog unchanged (<= 21 days old)."
          else
            git commit -m "chore(catalog): refresh bundled Podcast Index partial snapshot"
            git push
          fi
